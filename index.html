<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Hub - Study Corner</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #00ff88;
            font-size: 2.5rem;
            text-shadow: 0 0 10px rgba(0,255,136,0.3);
        }
        p {
            color: #aaaaaa;
            margin-top: 5px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #1e1e1e;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: #00ff88;
            box-shadow: 0 5px 15px rgba(0,255,136,0.2);
        }
        .card h3 {
            font-size: 1.25rem;
            margin-bottom: 10px;
        }
        .card p {
            font-size: 0.85rem;
        }
        /* Game Viewer Overlay */
        #viewer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            flex-direction: column;
        }
        .nav-bar {
            background: #1e1e1e;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
        }
        .back-btn {
            background: #ff3b30;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .back-btn:hover {
            background: #ff453a;
        }
        iframe {
            width: 100%;
            flex-grow: 1;
            border: none;
            background: white;
        }
    </style>
</head>
<body>

    <header>
        <h1>Classroom Resource Center</h1>
        <p>A simple dashboard for interactive break times.</p>
    </header>

    <div class="grid">
        <!-- Game 1 -->
        <div class="card" onclick="playGame('https://github.io')">
            <h3>2048</h3>
            <p>Slide blocks and reach the legendary tile!</p>
        </div>
        <!-- Game 2 -->
        <div class="card" onclick="playGame('https://github.io')">
            <h3>Clumsy Bird</h3>
            <p>A fun, open-source clone of Flappy Bird.</p>
        </div>
        <!-- Game 3 -->
        <div class="card" onclick="playGame('https://hextris.io')">
            <h3>Hextris</h3>
            <p>Fast-paced puzzle dynamic inspired by Tetris.</p>
        </div>
        <!-- Game 4 -->
        <div class="card" onclick="playGame('https://pacman.com')">
            <h3>Pac-Man</h3>
            <p>The iconic arcade maze puzzle game.</p>
        </div>
    </div>

    <!-- Hidden full-screen player -->
    <div id="viewer">
        <div class="nav-bar">
            <h2 id="game-title">Playing Game</h2>
            <button class="back-btn" onclick="closeGame()">Back to Hub</button>
        </div>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <script>
        function playGame(url) {
            const viewer = document.getElementById('viewer');
            const frame = document.getElementById('game-frame');
            frame.src = url;
            viewer.style.display = 'flex';
        }

        function closeGame() {
            const viewer = document.getElementById('viewer');
            const frame = document.getElementById('game-frame');
            frame.src = '';
            viewer.style.display = 'none';
        }
    </script>
</body>
</html>
