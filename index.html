<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RANDOMS Unblocked Games</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0c10;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 40px;
        }
        h1 {
            color: #66fcf1;
            font-size: 3rem;
            text-shadow: 0 0 15px rgba(102,252,241,0.4);
            letter-spacing: 2px;
        }
        p {
            color: #c5c6c7;
            margin-top: 8px;
            font-size: 1.1rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1000px;
            padding: 20px;
        }
        .launch-card {
            background: #1f2833;
            border: 3px solid #45f248;
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .launch-card:hover {
            transform: translateY(-8px);
            border-color: #66fcf1;
            box-shadow: 0 10px 25px rgba(102,252,241,0.3);
        }
        .launch-card h2 {
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 12px;
        }
        .launch-card p {
            color: #66fcf1;
            font-size: 0.95rem;
            font-weight: bold;
        }
        /* Fullscreen Game Space Overlay */
        #viewer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            z-index: 1000;
            flex-direction: column;
        }
        .nav-bar {
            background: #1f2833;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #45f248;
        }
        .nav-bar h2 {
            font-size: 1.5rem;
            color: #66fcf1;
        }
        .back-btn {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.2s;
        }
        .back-btn:hover {
            background: #ff1a1a;
        }
        iframe {
            width: 100%;
            flex-grow: 1;
            border: none;
            background: #000000;
        }
    </style>
</head>
<body>

    <header>
        <h1>RANDOMS Unblocked Games</h1>
        <p>Select a portal to load your full-screen game session.</p>
    </header>

    <!-- Grid Menu for All Your Custom Games -->
    <div class="grid">
        
        <!-- Game 1: Original Test Game -->
        <div class="launch-card" onclick="playGame('https://github.io', 'Main Test Environment')">
            <h2>Main Test</h2>
            <p>✦ LAUNCH GAME ✦</p>
        </div>

        <!-- Game 2: Birthday Bash -->
        <div class="launch-card" onclick="playGame('https://wasm.rip/files/birthdaybash/index.html', 'Birthday Bash')">
            <h2>Birthday Bash</h2>
            <p>✦ LAUNCH GAME ✦</p>
        </div>

        <!-- Game 3: Brotato -->
        <div class="launch-card" onclick="playGame('https://wasm.rip/files/bpac/index.html', 'Brotato')">
            <h2>Brotato</h2>
            <p>✦ LAUNCH GAME ✦</p>
        </div>

    </div>

    <!-- Full-screen Embedded iframe Window -->
    <div id="viewer">
        <div class="nav-bar">
            <h2 id="current-game-title">RANDOMS Arcade Space</h2>
            <button class="back-btn" onclick="closeGame()">Close Hub</button>
        </div>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <script>
        function playGame(url, title) {
            const viewer = document.getElementById('viewer');
            const frame = document.getElementById('game-frame');
            const titleElement = document.getElementById('current-game-title');
            
            titleElement.innerText = title;
            frame.src = url;
            viewer.style.display = 'flex';
        }

        function closeGame() {
            const viewer = document.getElementById('viewer');
            const frame = document.getElementById('game-frame');
            frame.src = '';
            viewer.style.display = 'none';
        }
    </script>
</body>
</html>
