<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Intro</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0e12;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        /* Canvas styles for the background wave effect */
        #waveCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .container {
            text-align: center;
            z-index: 2;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .typing-text {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 2px;
            border-right: 4px solid #7289da;
            white-space: nowrap;
            overflow: hidden;
            margin-bottom: 10px;
            animation: typing 3.5s steps(40, end), blink-caret 0.75s step-end infinite;
        }
        .subtext {
            font-size: 1.2rem;
            color: #8a8f98;
            margin-bottom: 40px;
        }
        .enter-btn {
            background-color: #7289da;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(114, 137, 218, 0.4);
            text-decoration: none;
            display: inline-block;
        }
        .enter-btn:hover {
            background-color: #5b73c7;
            transform: translateY(-3px);
            box-shadow: 0 0 25px rgba(114, 137, 218, 0.8);
        }
        .icon-row {
            margin-top: 40px;
            display: none;
            justify-content: center;
            gap: 30px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .icon-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .icon-link svg {
            width: 100%;
            height: 100%;
            fill: #8a8f98;
            transition: fill 0.3s ease, filter 0.3s ease;
        }
        .icon-link:hover {
            transform: scale(1.2);
        }
        .icon-link.games:hover svg {
            fill: #ff4757;
            filter: drop-shadow(0 0 8px rgba(255, 71, 87, 0.8));
        }
        .icon-link.apps:hover svg {
            fill: #2ed573;
            filter: drop-shadow(0 0 8px rgba(46, 213, 115, 0.8));
        }
        .icon-link.discord:hover svg {
            fill: #5865F2;
            filter: drop-shadow(0 0 8px rgba(88, 101, 242, 0.8));
        }
        
        /* --- Undertale Souls Layout --- */
        .souls-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        .soul-heart {
            width: 24px;
            height: 24px;
            transition: transform 0.2s ease, filter 0.2s ease;
            cursor: pointer;
        }
        .soul-heart:hover {
            transform: scale(1.3);
        }
        /* Color themes for the Undertale souls */
        .soul-red { fill: #FF0000; filter: drop-shadow(0 0 6px #FF0000); }
        .soul-cyan { fill: #00FFFF; filter: drop-shadow(0 0 6px #00FFFF); }
        .soul-orange { fill: #FF9900; filter: drop-shadow(0 0 6px #FF9900); }
        .soul-blue { fill: #0000FF; filter: drop-shadow(0 0 6px #0000FF); }
        .soul-purple { fill: #AA00FF; filter: drop-shadow(0 0 6px #AA00FF); }
        .soul-green { fill: #00FF00; filter: drop-shadow(0 0 6px #00FF00); }
        .soul-yellow { fill: #FFFF00; filter: drop-shadow(0 0 6px #FFFF00); }

        .clock {
            margin-top: 10px;
            font-size: 1rem;
            color: #4f545c;
        }
        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }
        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: #7289da; }
        }
    </style>
</head>
<body>

    <!-- Background Canvas Element -->
    <canvas id="waveCanvas"></canvas>

    <div class="container">
        <div class="typing-text">RANDOMS</div>
        <div class="subtext" id="siteSubtext">Secure. Fast. Unrestricted.</div>
        <button class="enter-btn" id="enterBtn">ENTER SITE</button>
        
        <div class="icon-row" id="mainIcons">
            <a href="https://google.com" class="icon-link games" title="Games">
                <svg viewBox="0 0 640 512"><path d="M192 64C86 64 0 150 0 256S86 448 192 448H448c106 0 192-86 192-192s-86-192-192-192H192zM496 168a40 40 0 1 1 0 80 40 40 0 1 1 0-80zM392 272a40 40 0 1 1 80 0 40 40 0 1 1 -80 0zm128 40a40 40 0 1 1 0 80 40 40 0 1 1 0-80zM120 256c0-13.3 10.7-24 24-24h24V208c0-13.3 10.7-24 24-24s24 10.7 24 24v24h24c13.3 0 24 10.7 24 24s-10.7 24-24 24H216v24c0 13.3-10.7 24-24 24s-24-10.7-24-24V280H144c-13.3 0-24-10.7-24-24z"/></svg>

                <svg viewBox="0 0 512 512"><path d="M256 0c11.5 0 21.4 7.6 24.3 18.7l48 180H504c11.9 0 21.6 9.7 21.6 21.6c0 5.4-2 10.6-5.7 14.6l-144 156 48 180c3 11.2-3.6 22.9-14.8 25.9c-5.4 1.4-11.2 .5-16-2.5L256 500l-137.4 92.4c-9.9 6.7-23.4 3.9-30-6c-3-4.5-4-9.9-2.7-15.2l48-180L10.1 235c-8.8-9.5-8.1-24.3 1.4-33.1c4-3.7 9.3-5.7 14.8-5.7H183.7l48-180C234.6 7.6 244.5 0 256 0z"/></svg>
            </a>
            <a href="https://discord.gg" target="_blank" class="icon-link discord" title="Join Discord">
                <svg viewBox="0 0 640 512"><path d="M524.5 69.8a509.3 509.3 0 0 0 -125.7-39c-5.3 9.4-11.2 24.2-15.4 34.3a470.7 470.7 0 0 0 -172.8 0c-4.2-10.1-10.2-24.9-15.5-34.3A509.3 509.3 0 0 0 69.5 70C1.6 171.2-16.1 269.8 13.2 367a517.9 517.9 0 0 0 156.4 79.1c37.3-50.9 69.6-106.7 95.8-166.4a371.4 371.4 0 0 1 -151.3-73c10-7.3 19.8-15 29.2-23c306 141.2 541 141.2 543.1 141.2c9.4 7.9 19.2 15.6 29.2 23a371.1 371.1 0 0 1 -151.3 73c26.2 59.7 58.5 115.4 95.8 166.4a517.9 517.9 0 0 0 156.4-79.1c33.9-107.5 14.8-204.8-49.8-297.2zM215.8 304.4c-30.3 0-55.3-27.7-55.3-61.6s24.4-61.6 55.3-61.6s55.6 27.8 55.3 61.6c0 33.8-24.7 61.6-55.3 61.6zm210.6 0c-30.3 0-55.3-27.7-55.3-61.6s24.4-61.6 55.3-61.6s55.6 27.8 55.3 61.6c0 33.8-24.7 61.6-55.3 61.6z"/></svg>
            </a>
        </div>

        <!-- The Seven Souls -->
        <div class="souls-row">
            <svg class="soul-heart soul-red" viewBox="0 0 32 32" title="Determination"><path d="M16,28 C16,28 2,18 2,10 C2,5 6,2 11,2 C14,2 16,5 16,5 C16,5 18,2 21,2 C26,2 30,5 30,10 C30,18 16,28 16,28 Z"/></svg>
            <svg class="soul-heart soul-cyan" viewBox="0 0 32 32" title="Patience"><path d="M16,28 C16,28 2,18 2,10 C2,5 6,2 11,2 C14,2 16,5 16,5 C16,5 18,2 21,2 C26,2 30,5 30,10 C30,18 16,28 16,28 Z"/></svg>
            <svg class="soul-heart soul-orange" viewBox="0 0 32 32" title="Bravery"><path d="M16,28 C16,28 2,18 2,10 C2,5 6,2 11,2 C14,2 16,5 16,5 C16,5 18,2 21,2 C26,2 30,5 30,10 C30,18 16,28 16,28 Z"/></svg>
            <svg class="soul-heart soul-blue" viewBox="0 0 32 32" title="Integrity"><path d="M16,28 C16,28 2,18 2,10 C2,5 6,2 11,2 C14,2 16,5 16,5 C16,5 18,2 21,2 C26,2 30,5 30,10 C30,18 16,28 16,28 Z"/></svg>
            <svg class="soul-heart soul-purple" viewBox="0 0 32 32" title="Perseverance"><path d="M16,28 C16,28 2,18 2,10 C2,5 6,2 11,2 C14,2 16,5 16,5 C16,5 18,2 21,2 C26,2 30,5 30,10 C30,18 16,28 16,28 Z"/></svg>
            <svg class="soul-heart soul-green" viewBox="0 0 32 32" title="Kindness"><path d="M16,28 C16,28 2,18 2,10 C2,5 6,2 11,2 C14,2 16,5 16,5 C16,5 18,2 21,2 C26,2 30,5 30,10 C30,18 16,28 16,28 Z"/></svg>
            <svg class="soul-heart soul-yellow" viewBox="0 0 32 32" title="Justice"><path d="M16,28 C16,28 2,18 2,10 C2,5 6,2 11,2 C14,2 16,5 16,5 C16,5 18,2 21,2 C26,2 30,5 30,10 C30,18 16,28 16,28 Z"/></svg>
        </div>

        <div class="clock" id="liveClock">00:00:00 PM</div>
    </div>

    <script>
        // System Clock Logic
        function updateClock() {
            const now = new Date();
            let timeString = now.toLocaleTimeString();
            document.getElementById('liveClock').textContent = timeString;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Reveal Icons on Click with Fullscreen Trigger
        document.getElementById('enterBtn').addEventListener('click', function() {
            var docElm = document.documentElement;
            if (docElm.requestFullscreen) {
                docElm.requestFullscreen();
            } else if (docElm.webkitRequestFullscreen) {
                docElm.webkitRequestFullscreen();
            } else if (docElm.msRequestFullscreen) {
                docElm.msRequestFullscreen();
            }
            this.style.display = 'none';
            document.getElementById('siteSubtext').textContent = "Choose your destination below:";
            var iconContainer = document.getElementById('mainIcons');
            iconContainer.style.display = 'flex';
            setTimeout(function() {
                iconContainer.style.opacity = '1';
            }, 50);
        });

        // --- Interactive Mouse Wave Logic ---
        const canvas = document.getElementById('waveCanvas');
