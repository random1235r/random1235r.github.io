<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RANDOMS Unblocked Games</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #050508;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        header {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 50px;
        }
        h1 {
            color: #00ffcc;
            font-size: 3.5rem;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        p {
            color: #64748b;
            margin-top: 10px;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }
        
        /* Main Proxy Search Bar Area */
        .search-section {
            width: 100%;
            max-width: 700px;
            margin-bottom: 50px;
            background: linear-gradient(145deg, #0f111a, #151926);
            padding: 30px;
            border-radius: 24px;
            border: 2px solid #1e293b;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
        }
        .search-section h2 {
            font-size: 1.4rem;
            color: #00ffcc;
            margin-bottom: 15px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .proxy-input-wrapper {
            display: flex;
            gap: 12px;
            background: #090a0f;
            padding: 8px 8px 8px 20px;
            border-radius: 50px;
            border: 2px solid #334155;
            transition: border-color 0.3s;
        }
        .proxy-input-wrapper:focus-within {
            border-color: #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }
        .proxy-input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 1.1rem;
        }
        .proxy-input-wrapper button {
            background: #00ffcc;
            color: #050508;
            border: none;
            font-weight: bold;
            padding: 12px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s, background-color 0.2s;
        }
        .proxy-input-wrapper button:hover {
            background: #33ffdd;
            transform: scale(1.02);
        }

        /* Arcade Grid Area */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1000px;
            padding: 20px;
        }
        .launch-card {
            background: #0f111a;
            border: 2px solid #1e293b;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .launch-card:hover {
            transform: translateY(-8px);
            border-color: #38bdf8;
            box-shadow: 0 15px 30px rgba(56, 189, 248, 0.15);
        }
        .launch-card h3 {
            font-size: 1.6rem;
            color: #ffffff;
            margin-bottom: 10px;
        }
        .launch-card p {
            color: #38bdf8;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            margin: 0;
        }

        /* Fullscreen Viewport Window */
        #viewer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            z-index: 1000;
            flex-direction: column;
        }
        .nav-bar {
            background: #0f111a;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #00ffcc;
        }
        .nav-bar h2 {
            font-size: 1.3rem;
            color: #00ffcc;
            font-weight: 500;
        }
        .back-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        .back-btn:hover {
            background: #dc2626;
        }
        iframe {
            width: 100%;
            flex-grow: 1;
            border: none;
            background: #ffffff;
        }
    </style>
</head>
<body>

    <header>
        <h1>RANDOMS UNBLOCKED</h1>
        <p>Secure Portal Network & Game Engine</p>
    </header>

    <!-- NEW DESIGN: Central Proxy Search Engine Bar -->
    <div class="search-section">
        <h2>Stealth Proxy Browser</h2>
        <div class="proxy-input-wrapper">
            <input type="text" id="proxy-url" placeholder="Search the web or enter a URL..." onkeydown="if(event.key === 'Enter') launchProxy()">
            <button onclick="launchProxy()">Browse</button>
        </div>
    </div>

    <!-- Game Selection Zone -->
    <div class="grid">
        <div class="launch-card" onclick="playGame('https://github.io', 'Main Test Environment')">
            <h3>Main Test</h3>
            <p>✦ Boot System ✦</p>
        </div>

        <div class="launch-card" onclick="playGame('https://wasm.rip', 'Birthday Bash')">
            <h3>Birthday Bash</h3>
            <p>✦ Boot System ✦</p>
        </div>

        <div class="launch-card" onclick="playGame('https://wasm.rip', 'Brotato')">
            <h3>Brotato</h3>
            <p>✦ Boot System ✦</p>
        </div>
    </div>

    <!-- Hidden Viewport Player Frame -->
    <div id="viewer">
        <div class="nav-bar">
            <h2 id="current-game-title">Proxy Terminal Loaded</h2>
            <button class="back-btn" onclick="closeGame()">Exit Session</button>
        </div>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <script>
        // Main view engine launcher
        function playGame(url, title) {
            const viewer = document.getElementById('viewer');
            const frame = document.getElementById('game-frame');
            const titleElement = document.getElementById('current-game-title');
            
            titleElement.innerText = title;
            frame.src = url;
            viewer.style.display = 'flex';
        }

        // Smart Proxy Search Router
        function launchProxy() {
            let query = document.getElementById('proxy-url').value.trim();
            if (!query) return;

            let targetUrl = "";

            // Check if user typed a regular domain name like google.com or https://site.com
            const isUrl = query.includes('.') && !query.includes(' ');

            if (isUrl) {
                // If it's a direct website link, fix the prefix formatting
                if (!query.startsWith('http://') && !query.startsWith('https://')) {
                    targetUrl = 'https://' + query;
                } else {
                    targetUrl = query;
                }
            } else {
                // If they typed text keywords instead, send it straight to an embedded search engine page!
                // DuckDuckGo is used here because it handles iframe nesting well.
                targetUrl = 'https://duckduckgo.com' + encodeURIComponent(query);
            }

            // Launch the resulting string inside your viewer panel
            playGame(targetUrl, "Proxy Frame: " + query);
        }

        function closeGame() {
            const viewer = document.getElementById('viewer');
            const frame = document.getElementById('game-frame');
            frame.src = '';
            viewer.style.display = 'none';
        }
    </script>
</body>
</html>
