<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Intro</title>
    <!-- Importing Font Awesome for clean, high-quality vector icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0e12;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            z-index: 2;
        }

        .typing-text {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 2px;
            border-right: 4px solid #7289da;
            white-space: nowrap;
            overflow: hidden;
            margin-bottom: 10px;
            animation: typing 3.5s steps(40, end), blink-caret 0.75s step-end infinite;
        }

        .subtext {
            font-size: 1.2rem;
            color: #8a8f98;
            margin-bottom: 40px;
        }

        .enter-btn {
            background-color: #7289da;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(114, 137, 218, 0.4);
            text-decoration: none;
            display: inline-block;
        }

        .enter-btn:hover {
            background-color: #5b73c7;
            transform: translateY(-3px);
            box-shadow: 0 0 25px rgba(114, 137, 218, 0.8);
        }

        /* Styling for the new icon shortcut container */
        .icon-row {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .icon-link {
            color: #8a8f98;
            font-size: 1.8rem;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        /* Smooth hover animations for each custom category badge */
        .icon-link:hover {
            transform: scale(1.2);
        }

        .icon-link.games:hover {
            color: #ff4757;
            text-shadow: 0 0 15px rgba(255, 71, 87, 0.6);
        }

        .icon-link.apps:hover {
            color: #2ed573;
            text-shadow: 0 0 15px rgba(46, 213, 115, 0.6);
        }

        .icon-link.discord:hover {
            color: #5865F2;
            text-shadow: 0 0 15px rgba(88, 101, 242, 0.6);
        }

        .clock {
            margin-top: 30px;
            font-size: 1rem;
            color: #4f545c;
        }

        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }

        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: #7289da; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="typing-text">RANDOMS</div>
        <div class="subtext">Secure. Fast. Unrestricted.</div>
        
        <a href="https://google.com" 
           class="enter-btn" 
           id="enterBtn">ENTER SITE</a>
        
        <!-- NEW: Dedicated Navigation Quick-Links and Community Badges -->
        <div class="icon-row">
            <!-- Game Icon (Sends them straight to your site's home or a game page) -->
            <a href="https://google.com" class="icon-link games" title="Games">
                <i class="fa-solid fa-gamepad"></i>
            </a>
            <!-- App Icon (Sends them to your main app section) -->
            <a href="https://google.com" class="icon-link apps" title="Apps">
                <i class="fa-solid fa-cubes"></i>
            </a>
            <!-- Discord Icon (Replace the # link with your live community invite link!) -->
            <a href="#" target="_blank" class="icon-link discord" title="Join Discord">
                <i class="fa-brands fa-discord"></i>
            </a>
        </div>
        
        <div class="clock" id="liveClock">00:00:00 PM</div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            let timeString = now.toLocaleTimeString();
            document.getElementById('liveClock').textContent = timeString;
        }
        setInterval(updateClock, 1000);
        updateClock();

        document.getElementById('enterBtn').addEventListener('click', function(e) {
            e.preventDefault(); 
            var targetUrl = this.getAttribute('href');
            var docElm = document.documentElement;

            if (docElm.requestFullscreen) {
                docElm.requestFullscreen();
            } else if (docElm.webkitRequestFullscreen) { 
                docElm.webkitRequestFullscreen();
            } else if (docElm.msRequestFullscreen) { 
                docElm.msRequestFullscreen();
            }

            setTimeout(function() {
                window.location.href = targetUrl;
            }, 100); 
        });
    </script>

</body>
</html>
