<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Intro</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0e12;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
        }
        /* Canvas styles for the background wave effect */
        #waveCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .container {
            text-align: center;
            z-index: 2;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            width: 100%;
            max-width: 900px;
            box-sizing: border-box;
        }
        .typing-text {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 2px;
            border-right: 4px solid #7289da;
            white-space: nowrap;
            overflow: hidden;
            margin-bottom: 10px;
            animation: typing 3.5s steps(40, end), blink-caret 0.75s step-end infinite;
        }
        .subtext {
            font-size: 1.2rem;
            color: #8a8f98;
            margin-bottom: 40px;
        }
        .enter-btn {
            background-color: #7289da;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(114, 137, 218, 0.4);
            text-decoration: none;
            display: inline-block;
        }
        .enter-btn:hover {
            background-color: #5b73c7;
            transform: translateY(-3px);
            box-shadow: 0 0 25px rgba(114, 137, 218, 0.8);
        }
        .icon-row {
            margin-top: 40px;
            display: none;
            justify-content: center;
            gap: 30px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .icon-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            transition: all 0.3s ease;
            text-decoration: none;
            cursor: pointer;
        }
        .icon-link svg {
            width: 100%;
            height: 100%;
            fill: #8a8f98;
            transition: fill 0.3s ease, filter 0.3s ease;
        }
        .icon-link:hover {
            transform: scale(1.2);
        }
        .icon-link.games:hover svg {
            fill: #ff4757;
            filter: drop-shadow(0 0 8px rgba(255, 71, 87, 0.8));
        }
        .icon-link.apps:hover svg {
            fill: #2ed573;
            filter: drop-shadow(0 0 8px rgba(46, 213, 115, 0.8));
        }
        .icon-link.discord:hover svg {
            fill: #5865F2;
            filter: drop-shadow(0 0 8px rgba(88, 101, 242, 0.8));
        }
        .clock {
            margin-top: 30px;
            font-size: 1.2rem;
            font-family: monospace;
            color: #7289da;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        /* --- New Games Grid Styles --- */
        .games-section {
            width: 100%;
            margin-top: 40px;
            display: none;
            flex-direction: column;
            gap: 25px;
            opacity: 0;
            transition: opacity 0.6s ease, transform 0.6s ease;
            transform: translateY(20px);
        }
        .games-section.show {
            display: flex;
            opacity: 1;
            transform: translateY(0);
        }
        .featured-games {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
        }
        .featured-card {
            background: linear-gradient(135deg, #1e2029 0%, #13151c 100%);
            border: 2px solid #7289da;
            border-radius: 12px;
            height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .featured-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(114, 137, 218, 0.4);
            border-color: #ff4757;
        }
        .featured-card h3 {
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 1px;
            font-weight: 700;
        }
        .featured-card span {
            font-size: 0.9rem;
            color: #ff4757;
            text-transform: uppercase;
            margin-top: 5px;
            font-weight: 600;
            letter-spacing: 2px;
        }
        .regular-games {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            width: 100%;
        }
        .game-square {
            background-color: #161821;
            border: 1px solid #2f313d;
            aspect-ratio: 1 / 1;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 600;
            color: #8a8f98;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .game-square:hover {
            background-color: #1e202e;
            border-color: #7289da;
            color: #ffffff;
            transform: scale(1.05);
        }

        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }
        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: #7289da; }
        }
    </style>
</head>
<body>

            </a>
        </div>
        <div class="clock" id="liveClock">00:00:00 PM</div>

        <!-- --- Game Content Section --- -->
        <div class="games-section" id="gamesSection">
            <div class="featured-games">
                <div class="featured-card">
                    <h3>UNDERTALE</h3>
                    <span>Featured</span>
                </div>
                <div class="featured-card">
                    <h3>DELTARUNE</h3>

            </div>
        </div>
    </div>

    <script>
        // --- 1. SITE INITIALIZATION & TOGGLE CONTROLS ---
        const enterBtn = document.getElementById('enterBtn');
        const mainIcons = document.getElementById('mainIcons');
